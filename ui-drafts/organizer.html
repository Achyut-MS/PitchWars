<script>
  // Draft only: shows or hides the password. The real page keeps the password field as it is.
  const eye = document.querySelector('.eye'), pw = document.querySelector('input[name=password]');
  eye.addEventListener('click', () => { const show = pw.type === 'password'; pw.type = show ? 'text' : 'password'; eye.setAttribute('aria-pressed', String(show)); eye.setAttribute('aria-label', show ? 'Hide password' : 'Show password'); });
</script>
